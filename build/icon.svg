<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- MediaDeck: the app's brand square (blue → purple) with a play mark in front of a deck of cards -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EA8FE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <!-- the deck: two cards behind -->
  <rect x="70" y="58" width="124" height="88" rx="16" fill="#FFFFFF" opacity="0.35"/>
  <rect x="58" y="76" width="140" height="98" rx="18" fill="#FFFFFF" opacity="0.55"/>
  <!-- the front card with the play mark -->
  <rect x="46" y="96" width="164" height="112" rx="20" fill="#FFFFFF"/>
  <path d="M112 124 L112 180 L160 152 Z" fill="#3B82F6"/>
</svg>
