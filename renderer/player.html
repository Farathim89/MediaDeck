<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:*">
  <title>Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body class="osd-visible">
  <!-- Music: cover and track info (videos leave this hidden) -->
  <section id="music">
    <div class="music-bg"></div>
    <div class="music-inner">
      <div class="cover"><span class="cover-icon"></span><img alt=""></div>
      <div class="music-text">
        <div class="music-kicker"></div>
        <h1 class="music-title"></h1>
        <div class="music-artist"></div>
        <div class="music-album"></div>
      </div>
    </div>
  </section>

  <header id="top">
    <div>
      <div id="title"></div>
      <div id="subtitle"></div>
    </div>
    <div class="clock"><div class="clock-time">--:--</div><div class="clock-date"></div></div>
  </header>

  <div id="center-icon"></div>
  <div id="buffering"><div class="spinner"></div></div>

  <footer id="bottom">
    <div id="seek" class="focusable" data-group="seek">
      <div class="seek-track"><div class="seek-fill"></div><div class="seek-knob"></div></div>
      <div class="seek-preview"></div>
    </div>
    <div class="times"><span id="time-pos">0:00</span><span id="time-end"></span></div>
    <div class="controls">
      <div class="controls-main">
        <button class="ctl focusable" data-group="ctl" data-act="prev" title="Previous"></button>
        <button class="ctl focusable" data-group="ctl" data-act="rew" title="Back 10 s"></button>
        <button class="ctl ctl-big focusable" data-group="ctl" data-act="toggle" title="Play / pause"></button>
        <button class="ctl focusable" data-group="ctl" data-act="fwd" title="Forward 30 s"></button>
        <button class="ctl focusable" data-group="ctl" data-act="next" title="Next"></button>
      </div>
      <div class="controls-side">
        <button class="ctl-pill focusable" data-group="ctl" data-act="audio"><span class="pi"></span><span class="pl">Audio</span></button>
        <button class="ctl-pill focusable" data-group="ctl" data-act="subs"><span class="pi"></span><span class="pl">Subtitles</span></button>
        <button class="ctl-pill focusable" data-group="ctl" data-act="list"><span class="pi"></span><span class="pl">Playlist</span></button>
        <button class="ctl-pill focusable" data-group="ctl" data-act="options"><span class="pi"></span><span class="pl">Options</span></button>
      </div>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/input.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player-settings.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
