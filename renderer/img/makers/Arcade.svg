<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d9a"/>
      <stop offset="0.55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#d81b6a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- joystick: base, stick, ball -->
  <g filter="url(#glow)">
    <rect x="20" y="132" width="132" height="34" rx="12" fill="#2a2f3a" stroke="url(#neon)" stroke-width="5"/>
    <rect x="80" y="70" width="12" height="66" rx="5" fill="#c9ced8"/>
    <circle cx="86" cy="58" r="30" fill="url(#ball)"/>
    <circle cx="76" cy="47" r="9" fill="#ffffff" opacity="0.55"/>
    <!-- two buttons -->
    <circle cx="44" cy="116" r="11" fill="#ffd23f"/>
    <circle cx="130" cy="116" r="11" fill="#33c3ff"/>
  </g>
  <!-- wordmark -->
  <text x="372" y="128" text-anchor="middle" filter="url(#glow)"
        font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900"
        font-size="92" letter-spacing="4" font-style="italic" fill="url(#neon)">ARCADE</text>
  <rect x="190" y="148" width="364" height="7" rx="3.5" fill="url(#neon)" opacity="0.85"/>
</svg>
