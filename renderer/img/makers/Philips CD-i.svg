<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <defs>
    <!-- the shine of a compact disc -->
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf3"/>
      <stop offset="0.3" stop-color="#9fd8ff"/>
      <stop offset="0.5" stop-color="#d9b8ff"/>
      <stop offset="0.7" stop-color="#ffe6a6"/>
      <stop offset="1" stop-color="#c3cad6"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4e6"/>
    </linearGradient>
  </defs>
  <!-- disc -->
  <circle cx="96" cy="100" r="82" fill="url(#disc)"/>
  <circle cx="96" cy="100" r="82" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="96" cy="100" r="28" fill="#0b5ed7"/>
  <circle cx="96" cy="100" r="11" fill="#0d0f14"/>
  <path d="M40 62 A70 70 0 0 1 96 30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- PHILIPS above, CD-i below -->
  <text x="372" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="40" letter-spacing="10" fill="#4a8cff">PHILIPS</text>
  <text x="372" y="172" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900"
        font-size="118" font-style="italic" fill="url(#word)">CD-i</text>
</svg>
